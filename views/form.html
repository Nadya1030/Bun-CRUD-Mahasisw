<h2 class="text-xl font-bold mb-4">{{judul}}</h2>

<div class="bg-white p-6 shadow rounded max-w-lg">
  <form method="POST" action="{{action}}">
    <div class="mb-3">
      <label class="block text-gray-700 mb-1">Nama</label>
      <input name="nama" value="{{nama}}"
        class="border p-2 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="mb-3">
      <label class="block text-gray-700 mb-1">Jurusan</label>
      <input name="jurusan" value="{{jurusan}}"
        class="border p-2 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="mb-3">
      <label class="block text-gray-700 mb-1">Angkatan</label>
      <input name="angkatan" value="{{angkatan}}" type="number"
        class="border p-2 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="flex gap-2">
      <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">Simpan</button>
      <a href="/" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded">Batal</a>
    </div>
  </form>
</div>
